<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:{{ surface }};color:{{ ink }};font-family:'IBM Plex Sans',sans-serif;width:100%">
  <div style="display:flex;align-items:center;gap:12px;padding:9px 14px;background:{{ panel }};border-bottom:1px solid {{ hairStrong }}">
    <span style="display:flex;align-items:center;gap:7px;padding:4px 9px;border:1px solid {{ hairStrong }};border-radius:6px;background:{{ subtle }};font:500 11.5px/1 'IBM Plex Mono',monospace;color:{{ ink }}">personal.ledger <span style="font-size:9px;color:{{ ink3 }}">▾</span></span>
    <span style="padding:3px 9px;border-radius:4px;background:{{ activeBg }};color:{{ activeFg }};font:500 11px/1.3 'IBM Plex Sans',sans-serif">Priority</span>
    <span style="padding:3px 9px;border:1px solid {{ hairStrong }};border-radius:4px;font:400 11px/1.3 'IBM Plex Sans',sans-serif;color:{{ ink3 }}">Project</span>
    <span style="margin-left:auto;display:flex;align-items:center;gap:6px;padding:4px 8px;border:1px solid {{ hairStrong }};border-radius:6px;background:{{ subtle }}">
      <span style="width:9px;height:9px;border-radius:50%;background:{{ swatch }};border:1px solid {{ hairStrong }}"></span>
      <span style="font:500 10.5px/1 'IBM Plex Sans',sans-serif;color:{{ ink2 }}">{{ themeName }}</span>
      <span style="font:400 9px/1 'IBM Plex Mono',monospace;color:{{ ink3 }}">▾</span>
    </span>
    <span style="font:400 10.5px/1 'IBM Plex Mono',monospace;color:{{ ink3 }}">Wed 26 Aug</span>
  </div>

  <div style="display:flex;background:{{ subtle }};border-bottom:1px solid {{ hairStrong }}">
    <div style="width:250px;flex:none;box-sizing:border-box;display:flex;align-items:flex-end;padding:0 12px 6px 32px;font:600 9px/1.4 'IBM Plex Mono',monospace;letter-spacing:.08em;color:{{ ink3 }}">ITEM</div>
    <div style="display:flex">
      <sc-for list="{{ weeks }}" as="w" hint-placeholder-count="3">
        <div style="display:contents">
          <div style="width:190px;background:{{ w.tint }};border-left:1px solid {{ hairStrong }};border-right:1px solid {{ hairStrong }}">
            <div style="display:flex;align-items:center;gap:6px;padding:4px 8px 3px;border-bottom:1px solid {{ hair }}">
              <span style="font:600 10px/1 'IBM Plex Mono',monospace;letter-spacing:.05em;color:{{ ink }}">{{ w.id }}</span>
              <span style="font:400 9.5px/1 'IBM Plex Sans',sans-serif;color:{{ ink3 }}">{{ w.range }}</span>
              <sc-if value="{{ w.closeable }}" hint-placeholder-val="{{ false }}">
                <span style="margin-left:auto;width:15px;height:15px;border-radius:4px;background:{{ activeBg }};color:{{ activeFg }};display:grid;place-items:center;font:500 9px/1 'IBM Plex Mono',monospace">×</span>
              </sc-if>
            </div>
            <div style="display:grid;grid-template-columns:repeat(5,38px)">
              <sc-for list="{{ w.days }}" as="d" hint-placeholder-count="5">
                <div style="padding:4px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px">
                  <sc-if value="{{ d.today }}" hint-placeholder-val="{{ false }}">
                    <span style="width:22px;height:22px;border-radius:50%;background:{{ todayBg }};color:{{ todayFg }};display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 9px/1 'IBM Plex Mono',monospace"><span>{{ d.l }}</span><span style="font-weight:400;font-size:8px;opacity:.75">{{ d.n }}</span></span>
                  </sc-if>
                  <sc-if value="{{ d.vac }}" hint-placeholder-val="{{ false }}">
                    <span style="width:22px;height:22px;border-radius:50%;border:1px dashed {{ ink3 }};display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 9px/1 'IBM Plex Mono',monospace;color:{{ ink3 }}"><span>{{ d.l }}</span><span style="font-weight:400;font-size:8px">{{ d.n }}</span></span>
                  </sc-if>
                  <sc-if value="{{ d.plain }}" hint-placeholder-val="{{ true }}">
                    <span style="font:600 10px/1 'IBM Plex Sans',sans-serif;color:{{ ink2 }}">{{ d.l }}</span>
                    <span style="font:400 9px/1 'IBM Plex Mono',monospace;color:{{ ink3 }}">{{ d.n }}</span>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </div>
          <div style="width:40px;background:{{ weekendBg }};border-left:1px solid {{ hair }};border-right:1px solid {{ hair }}">
            <div style="height:18px;border-bottom:1px solid {{ hair }}"></div>
            <div style="display:grid;grid-template-columns:repeat(2,19px)">
              <sc-for list="{{ w.wend }}" as="d" hint-placeholder-count="2">
                <div style="padding:4px 0 5px;display:flex;flex-direction:column;align-items:center;gap:2px"><span style="font:400 9px/1 'IBM Plex Sans',sans-serif;color:{{ ink3 }}">{{ d.l }}</span><span style="font:400 8px/1 'IBM Plex Mono',monospace;color:{{ ink4 }}">{{ d.n }}</span></div>
              </sc-for>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <sc-for list="{{ rows }}" as="r" hint-placeholder-count="7">
    <div style="display:flex;align-items:stretch;border-bottom:1px solid {{ hair }}">
      <div style="width:250px;flex:none;box-sizing:border-box;display:flex;align-items:flex-start;padding:{{ r.pad }} 10px {{ r.pad }} 0">
        <span style="width:24px;flex:none;text-align:center;font:400 13px/1.4 'IBM Plex Mono',monospace;letter-spacing:-1px;color:{{ ink4 }}">⠿⠿</span>
        <span style="width:3px;align-self:stretch;flex:none;background:{{ r.bar }}"></span>
        <span style="width:10px;flex:none"></span>
        <sc-if value="{{ r.isSub }}" hint-placeholder-val="{{ false }}">
          <span style="width:14px;flex:none;height:9px;border-left:1px solid {{ hairStrong }};border-bottom:1px solid {{ hairStrong }}"></span>
        </sc-if>
        <span style="display:flex;flex-direction:column;gap:3px;min-width:0">
          <span style="font-family:'IBM Plex Sans',sans-serif;font-size:{{ r.size }};line-height:1.4;color:{{ r.fg }};text-decoration:{{ r.strike }};text-wrap:pretty">{{ r.title }}</span>
          <sc-if value="{{ r.link }}" hint-placeholder-val="">
            <span style="display:inline-flex;align-self:flex-start;align-items:center;gap:5px;padding:2px 7px 2px 4px;border:1px solid {{ hairStrong }};border-radius:11px;background:{{ chipBg }}">
              <span style="width:11px;height:11px;border-radius:2px;background:{{ linkDot }}"></span>
              <span style="font:400 10px/1.2 'IBM Plex Sans',sans-serif;color:{{ ink2 }}">{{ r.link }}</span>
            </span>
          </sc-if>
          <sc-for list="{{ r.notes }}" as="n" hint-placeholder-count="0">
            <span style="display:flex;gap:6px;font:400 11px/1.45 'IBM Plex Sans',sans-serif;color:{{ ink3 }}"><span style="color:{{ ink4 }}">•</span>{{ n }}</span>
          </sc-for>
        </span>
      </div>
      <div style="display:flex">
        <sc-for list="{{ r.weeks }}" as="w" hint-placeholder-count="3">
          <div style="display:contents">
            <div style="width:190px;display:grid;grid-template-columns:repeat(5,38px);background:{{ w.tint }};border-left:1px solid {{ hairStrong }};border-right:1px solid {{ hairStrong }}">
              <sc-for list="{{ w.wd }}" as="c" hint-placeholder-count="5">
                <div style="min-height:30px;border-left:1px solid {{ hair }};display:grid;align-items:center;padding:2.5px;background:{{ c.bg }}">
                  <sc-if value="{{ c.done }}" hint-placeholder-val="{{ false }}">
                    <span style="height:25px;display:grid;place-items:center;border-radius:5px;background:{{ doneBg }};font:600 11px/1 'IBM Plex Sans',sans-serif;color:{{ doneFg }};box-shadow:{{ c.ring }}">✓</span>
                  </sc-if>
                  <sc-if value="{{ c.due }}" hint-placeholder-val="{{ false }}">
                    <span style="height:25px;display:grid;place-items:center;border-radius:5px;background:{{ dueBg }};font:600 8.5px/1 'IBM Plex Mono',monospace;letter-spacing:.04em;color:{{ dueFg }};box-shadow:{{ c.ring }}">DUE</span>
                  </sc-if>
                </div>
              </sc-for>
            </div>
            <div style="width:40px;display:grid;grid-template-columns:repeat(2,19px);justify-content:center;background:{{ weekendBg }};border-left:1px solid {{ hair }};border-right:1px solid {{ hair }}">
              <sc-for list="{{ w.we }}" as="c" hint-placeholder-count="2">
                <div style="min-height:30px;padding:2.5px;display:grid;align-items:center;border-left:1px solid {{ hair }};background:{{ c.bg }}">
                  <sc-if value="{{ c.done }}" hint-placeholder-val="{{ false }}"><span style="height:25px;border-radius:4px;background:{{ doneBg }}"></span></sc-if>
                  <sc-if value="{{ c.due }}" hint-placeholder-val="{{ false }}"><span style="height:25px;border-radius:4px;background:{{ dueBg }}"></span></sc-if>
                </div>
              </sc-for>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <div style="display:flex;align-items:center;gap:8px;padding:8px 0 8px 14px;border-bottom:1px solid {{ hair }}">
    <span style="width:14px;height:14px;border-radius:4px;border:1px dashed {{ ink4 }};display:grid;place-items:center;font:400 10px/1 'IBM Plex Mono',monospace;color:{{ ink4 }}">+</span>
    <span style="font:400 12.5px/1.35 'IBM Plex Sans',sans-serif;color:{{ ink4 }}">add item</span>
    <span style="font:400 9.5px/1 'IBM Plex Mono',monospace;color:{{ ink4 }}">N</span>
  </div>

  <div style="display:flex;align-items:center;gap:14px;padding:8px 14px;background:{{ subtle }};border-top:1px solid {{ hairStrong }};font:400 10.5px/1.3 'IBM Plex Mono',monospace;color:{{ ink3 }}">
    <span>D due</span><span>V done</span><span>X clear</span><span>⌥↑↓ reorder</span><span>⌥←→ move due</span><span>N new</span>
    <span style="margin-left:auto">W34 closeable</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1000,&quot;height&quot;:420}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const T = {
      surface: p.surface ?? '#faf9f6', panel: p.panel ?? '#fff', subtle: p.subtle ?? '#f4f2ec',
      ink: p.ink ?? 'rgba(0,0,0,.88)', ink2: p.ink2 ?? 'rgba(0,0,0,.72)', ink3: p.ink3 ?? 'rgba(0,0,0,.45)', ink4: p.ink4 ?? 'rgba(0,0,0,.28)',
      hair: p.hair ?? 'rgba(0,0,0,.07)', hairStrong: p.hairStrong ?? 'rgba(0,0,0,.14)',
      doneBg: p.doneBg ?? 'oklch(.88 .07 155)', doneFg: p.doneFg ?? 'oklch(.4 .09 155)',
      dueBg: p.dueBg ?? 'oklch(.89 .1 85)', dueFg: p.dueFg ?? 'oklch(.42 .11 70)',
      todayBg: p.todayBg ?? '#1c1b19', todayFg: p.todayFg ?? '#fff',
      activeBg: p.activeBg ?? '#1c1b19', activeFg: p.activeFg ?? '#fff',
      weekendBg: p.weekendBg ?? 'rgba(0,0,0,.035)', pastTint: p.pastTint ?? 'rgba(0,0,0,.028)',
      todayTint: p.todayTint ?? 'oklch(.97 .015 250)', selBg: p.selBg ?? 'oklch(.96 .025 250)',
      selRing: p.selRing ?? 'oklch(.55 .13 250)', hlBg: p.hlBg ?? 'oklch(.95 .05 95)',
      chipBg: p.chipBg ?? '#fff', linkDot: p.linkDot ?? 'oklch(.72 .11 250)',
      barA: p.barA ?? 'oklch(.62 .1 210)', barB: p.barB ?? 'oklch(.6 .11 300)', barC: p.barC ?? 'oklch(.63 .09 140)',
      doneFgRow: p.doneFgRow ?? 'rgba(0,0,0,.4)', vacBg: p.vacBg ?? 'rgba(0,0,0,.05)'
    };
    const VAC = [17, 18], TODAY = 9;
    const tintFor = w => (w === 0 ? T.pastTint : 'transparent');
    const cells = spec => {
      const out = [];
      for (let w = 0; w < 3; w++) {
        const cs = [];
        for (let d = 0; d < 7; d++) {
          const i = w * 7 + d;
          let bg = 'transparent';
          if (VAC.includes(i)) bg = `repeating-linear-gradient(45deg,${T.vacBg} 0 3px,transparent 3px 6px)`;
          else if (spec.hl && spec.hl.includes(i)) bg = T.hlBg;
          else if (spec.sel === i) bg = T.selBg;
          else if (i === TODAY) bg = T.todayTint;
          cs.push({
            done: spec.done ? spec.done.includes(i) : false,
            due: spec.due === i, bg,
            ring: spec.sel === i ? `inset 0 0 0 2px ${T.selRing}` : 'none'
          });
        }
        out.push({ tint: tintFor(w), wd: cs.slice(0, 5), we: cs.slice(5) });
      }
      return out;
    };
    const mkDays = nums => ['M', 'T', 'W', 'TH', 'F', 'S', 'S'].map((l, i) => ({ l, n: String(nums[i]), weekend: i > 4 }));
    const weeks = [
      { id: 'W34', range: 'Aug 17 – 23', closeable: true, tint: T.pastTint, days: mkDays([17, 18, 19, 20, 21, 22, 23]), today: -1, vac: [] },
      { id: 'W35', range: 'Aug 24 – 30', closeable: false, tint: 'transparent', days: mkDays([24, 25, 26, 27, 28, 29, 30]), today: 2, vac: [] },
      { id: 'W36', range: 'Aug 31 – Sep 6', closeable: false, tint: 'transparent', days: mkDays([31, 1, 2, 3, 4, 5, 6]), today: -1, vac: [3, 4] }
    ].map(w => {
      w.days.forEach((d, i) => {
        d.today = i === w.today;
        d.vac = w.vac.includes(i);
        d.plain = !d.today && !d.vac && !d.weekend;
      });
      w.wend = w.days.slice(5);
      w.days = w.days.slice(0, 5);
      return w;
    });
    const bars = { a: T.barA, b: T.barB, c: T.barC };
    const R = (title, bar, spec) => ({
      title, bar: bars[bar], isSub: !!spec.sub, link: spec.link || '', notes: spec.notes || [],
      pad: spec.done ? '4px' : '7px', size: spec.done ? '11.5px' : '12.5px',
      fg: spec.done ? T.doneFgRow : T.ink, strike: spec.done ? 'line-through' : 'none',
      weeks: cells(spec)
    });
    const rows = [
      R('choose stick-on tiles for kitchen', 'a', { due: 9, sel: 9, link: 'Kitchen finishes — Sheet', notes: ['peel-and-stick, not grout-look', '6.5 m² plus 10% waste'] }),
      R('send Q3 roadmap draft to Priya', 'b', { due: 9 }),
      R('renew passport — book appointment', 'c', { due: 15 }),
      R('choose dishwasher model', 'a', { done: [1] }),
      R('order dishwasher', 'a', { sub: true, done: [9] }),
      R('choose paint color for front room', 'a', { due: 11, hl: [10, 11] }),
      R('cancel gym membership', 'c', { done: [0] })
    ];
    return { ...T, weeks, rows, themeName: p.themeName ?? 'Paper', swatch: p.swatch ?? '#faf9f6' };
  }
}
</script>
</body>
</html>
